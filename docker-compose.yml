services:
  kisandirect-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kisandirect-production
    restart: unless-stopped
    ports:
      # Exposed on both port 5000 and 8080 as requested
      - "5000:3000"
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/backend/data/multi_portal.db
      - JWT_SECRET=kisandirect_production_super_secret_jwt_key_2026
      - ADMIN_EMAIL=owner@kisandirect.com
      - ADMIN_PASSWORD=owner123
    volumes:
      # Persistent volume for SQLite database storage across container restarts
      - kisandirect-data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kisandirect-data:
    driver: local
